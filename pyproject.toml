[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "reasoning-graph"
version = "0.1.0"
description = "Reasoning graph CLI and helper library"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "jsonschema>=4.23",
]

[project.scripts]
rg = "reasoning_graph.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
reasoning_graph = ["schemas/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests/scripts"]
